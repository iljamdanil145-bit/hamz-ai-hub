async function wfRun(){
  if (wfState.running) return;
  if (!wfState.nodes.length) { toast('Tambahkan step dulu', 'error'); return; }

  const inputNode = wfState.nodes.find(n => n.type === 'input');
  const userInput = inputNode ? ($('#wfUserInput')?.value?.trim() || '') : (wfState.userInput || '');
  if (inputNode && !userInput) { toast('Isi input dulu', 'error'); $('#wfUserInput')?.focus(); return; }

  // Reset progress
  wfState.progress = {};
  for (const n of wfState.nodes) wfState.progress[n.id] = { status:'pending', output:'', error:'' };
  wfState.finalOutput = '';
  wfState.running = true;
  wfState.abortController = new AbortController();
  wfState.userInput = userInput;

  renderWorkflowView();

  let currentOutput = userInput;
  let started = false;
  let errorAt = null;

  for (let i = 0; i < wfState.nodes.length; i++) {
    const node = wfState.nodes[i];
    if (wfState.abortController.signal.aborted) break;

    // input node passes through
    if (node.type === 'input') {
      wfState.progress[node.id] = { status:'success', output: userInput, error:'' };
      updateWfProgress();
      continue;
    }
    if (node.type === 'output') {
      wfState.progress[node.id] = { status:'success', output: currentOutput, error:'' };
      wfState.finalOutput = currentOutput;
      updateWfProgress();
      continue;
    }

    started = true;
    wfState.progress[node.id] = { status:'running', output:'', error:'' };
    updateWfProgress();

    try {
      // Build prompt: replace {{input}} with current output, otherwise append
      const tmpl = node.prompt || '{{input}}';
      const prompt = tmpl.includes('{{input}}')
        ? tmpl.replace(/\{\{input\}\}/g, currentOutput)
        : `${tmpl}\n\n--- Input from previous step ---\n${currentOutput}`;

      const messages = [
        { role:'system', content:'You are a step in an AI workflow. Process the input and return ONLY the result of this step. Be concise and produce clean output that can be used by the next step.' },
        { role:'user', content: prompt },
      ];

      const model = node.model || state.settings.model || OPENAI_MODEL;
      const result = await callAI(messages, {
        model,
        temperature: node.temperature ?? 0.7,
        maxTokens: 2048,
        signal: wfState.abortController.signal,
      });

      wfState.progress[node.id] = { status:'success', output: result, error:'' };
      currentOutput = result;
      updateWfProgress();
    } catch (err) {
      const msg = err?.message || 'Step gagal.';
      wfState.progress[node.id] = { status:'error', output:'', error: msg };
      errorAt = node.id;
      updateWfProgress();
      toast(`Step "${node.name}" gagal: ${msg}`, 'error', 4000);
      break;
    }
  }

  wfState.running = false;
  wfState.abortController = null;
  updateWfProgress();

  if (!errorAt && started) toast('Workflow selesai ✓', 'success', 1600);
  else if (errorAt) toast('Workflow berhenti karena error', 'error', 2400);
  else toast('Tidak ada step yang dijalankan', 'info', 1600);
}

function wfStop(){
  if (wfState.abortController) wfState.abortController.abort();
  wfState.running = false;
  toast('Workflow dihentikan', 'info', 1300);
  updateWfProgress();
}

async function wfRetryStep(nodeId){
  if (wfState.running) return;
  const idx = wfState.nodes.findIndex(n => n.id === nodeId);
  if (idx < 0) return;

  const inputNode = wfState.nodes.find(n => n.type === 'input');
  let currentOutput = inputNode ? (wfState.userInput || '') : '';

  // Rebuild output from all successful steps before this one
  for (let i = 0; i < idx; i++) {
    const n = wfState.nodes[i];
    const p = wfState.progress[n.id];
    if (p && p.status === 'success' && p.output) currentOutput = p.output;
  }

  const node = wfState.nodes[idx];
  wfState.progress[node.id] = { status:'running', output:'', error:'' };
  wfState.running = true;
  wfState.abortController = new AbortController();
  updateWfProgress();

  try {
    const tmpl = node.prompt || '{{input}}';
    const prompt = tmpl.includes('{{input}}')
      ? tmpl.replace(/\{\{input\}\}/g, currentOutput)
      : `${tmpl}\n\n--- Input from previous step ---\n${currentOutput}`;
    const messages = [
      { role:'system', content:'You are a step in an AI workflow. Process the input and return ONLY the result of this step.' },
      { role:'user', content: prompt },
    ];
    const model = node.model || state.settings.model || OPENAI_MODEL;
    const result = await callAI(messages, { model, temperature: node.temperature ?? 0.7, maxTokens: 2048, signal: wfState.abortController.signal });
    wfState.progress[node.id] = { status:'success', output: result, error:'' };
    toast(`Retry berhasil untuk "${node.name}"`, 'success', 1600);
  } catch (err) {
    wfState.progress[node.id] = { status:'error', output:'', error: err?.message || 'Gagal.' };
    toast(`Retry gagal: ${err.message}`, 'error', 3200);
  } finally {
    wfState.running = false;
    wfState.abortController = null;
    updateWfProgress();
  }
}

function updateWfProgress(){
  const el = $('#wfProgress');
  if (!el) return;
  const nodes = wfState.nodes;
  if (!nodes.length) { el.innerHTML = ''; return; }
  el.innerHTML = nodes.map((n, i) => {
    const p = wfState.progress[n.id] || { status:'pending' };
    const icon = p.status === 'success' ? '✓' : p.status === 'running' ? '⟳' : p.status === 'error' ? '✕' : '○';
    const info = wfNodeType(n.type);
    let extra = '';
    if (p.status === 'error' && p.error) extra = `<div style="font-size:11.5px;color:var(--danger);margin-top:4px">${escapeHtml(p.error)}</div>`;
    else if (p.status === 'success' && p.output) {
      const isOutputNode = n.type === 'output';
      if (isOutputNode) {
        extra = `<div class="wf-step-output" style="max-height:300px">${escapeHtml(p.output.slice(0, 2000))}${p.output.length > 2000 ? '\n…' : ''}</div>`;
      } else {
        extra = `<details style="margin-top:6px"><summary style="cursor:pointer;font-size:12px;color:var(--text-mute)">Lihat output</summary><div class="wf-step-output">${escapeHtml(p.output.slice(0, 1200))}${p.output.length > 1200 ? '\n…' : ''}</div></details>`;
      }
    }
    return `
      <div class="wf-progress-step ${p.status}">
        <div class="wps-icon">${icon}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600">${escapeHtml(n.name)} <span style="font-size:11px;color:var(--text-mute);font-weight:500">${info.icon}</span></div>
          ${extra}
        </div>
        ${p.status === 'error' ? `<button class="mini-btn" data-wf-retry="${n.id}" style="flex-shrink:0">Retry</button>` : ''}
      </div>`;
  }).join('');

  el.querySelectorAll('[data-wf-retry]').forEach(btn => {
    btn.addEventListener('click', () => wfRetryStep(btn.dataset.wfRetry));
  });
}

function renderWorkflowView(){
  const isFav = state.favorites.has('workflow');
  const saved = state.savedWorkflows;

  $('#app').innerHTML = `
    <section class="view active">
      <div class="container">
        <div class="page-head">
          <h1>🧩 AI Workflow Builder</h1>
          <p>Buat alur AI visual. Output step sebelumnya otomatis menjadi input step berikutnya.</p>
        </div>

        <div class="section" style="margin-top:22px">
          <div class="wf-shell">
            <div class="wf-toolbar">
              <input class="wf-name-input" type="text" id="wfNameInput" value="${escapeHtml(wfState.name)}" placeholder="Nama workflow..." />
              <button class="mini-btn" id="wfSampleBtn">+ Contoh</button>
              <button class="mini-btn" id="wfSaveBtn">💾 Save</button>
              <button class="mini-btn" id="wfExportBtn">⬇ Export</button>
              <button class="mini-btn" id="wfImportBtn">⬆ Import</button>
              <button class="mini-btn btn-danger" id="wfClearBtn">Clear</button>
            </div>

            <div class="wf-canvas">
              <div id="wfNodesWrap"></div>
              <div class="wf-add-row">
                <select id="wfAddTypeSelect">
                  ${WF_NODE_TYPES.filter(t => t.type !== 'input' && t.type !== 'output').map(t => `<option value="${t.type}">${t.icon} ${t.label}</option>`).join('')}
                </select>
                <button class="btn btn-sm btn-primary" id="wfAddBtn">+ Add Step</button>
              </div>
            </div>

            <div class="wf-run-panel">
              <div class="field" style="margin:0">
                <label for="wfUserInput">Input Awal (untuk node Input)</label>
                <textarea class="input" id="wfUserInput" rows="4" placeholder="Contoh: Artikel tentang teknologi AI...">${escapeHtml(wfState.userInput || '')}</textarea>
              </div>
              <div class="form-actions" style="margin:0">
                <button class="btn btn-primary" id="wfRunBtn"><span>▶</span> Run Workflow</button>
                <button class="btn btn-danger" id="wfStopBtn" disabled>Stop</button>
                <button class="btn" id="wfCopyResultBtn" disabled>Copy Result</button>
              </div>
              <div class="wf-progress" id="wfProgress"></div>
            </div>

            ${saved.length ? `
            <div class="panel" style="padding:16px">
              <div style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-mute);margin-bottom:10px">Saved Workflows (${saved.length})</div>
              <div style="display:flex;flex-direction:column;gap:8px">
                ${saved.map(w => `
                  <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.15);border:1px solid var(--border)">
                    <div style="flex:1;min-width:0">
                      <div style="font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(w.name)}</div>
                      <div style="font-size:11.5px;color:var(--text-mute);margin-top:2px">${w.nodes.length} step · ${fmtDate(w.savedAt)}</div>
                    </div>
                    <button class="mini-btn" data-wf-load="${w.id}">Load</button>
                    <button class="mini-btn btn-danger" data-wf-del="${w.id}">✕</button>
                  </div>`).join('')}
              </div>
            </div>` : ''}

            <div class="info-box" style="font-size:12.3px">
              💡 Workflow disimpan di localStorage browser kamu. API key tidak pernah disimpan.
            </div>
          </div>
        </div>
      </div>
    </section>`;

  // Render nodes
  renderWfNodes();

  // Wire toolbar
  $('#wfNameInput').addEventListener('input', (e) => { wfState.name = e.target.value; });
  $('#wfSampleBtn').addEventListener('click', wfDefaultSample);
  $('#wfSaveBtn').addEventListener('click', wfSaveLocal);
  $('#wfExportBtn').addEventListener('click', wfExport);
  $('#wfImportBtn').addEventListener('click', wfOpenImport);
  $('#wfClearBtn').addEventListener('click', wfClear);
  $('#wfAddBtn').addEventListener('click', () => {
    const t = $('#wfAddTypeSelect').value;
    wfAddNode(t);
  });
  $('#wfRunBtn').addEventListener('click', wfRun);
  $('#wfStopBtn').addEventListener('click', wfStop);
  $('#wfCopyResultBtn').addEventListener('click', () => {
    const out = wfState.finalOutput || '(kosong)';
    copyText(out, 'Hasil workflow disalin');
  });

  // Saved workflows
  $$('[data-wf-load]').forEach(btn => btn.addEventListener('click', () => wfLoadLocal(btn.dataset.wfLoad)));
  $$('[data-wf-del]').forEach(btn => btn.addEventListener('click', () => wfDeleteLocal(btn.dataset.wfDel)));

  // Update progress + run buttons
  updateWfProgress();
  const runBtn = $('#wfRunBtn');
  const stopBtn = $('#wfStopBtn');
  const copyResBtn = $('#wfCopyResultBtn');
  if (runBtn) runBtn.disabled = wfState.running || !wfState.nodes.length;
  if (stopBtn) stopBtn.disabled = !wfState.running;
  if (copyResBtn) copyResBtn.disabled = !wfState.finalOutput;
}

function renderWfNodes(){
  const wrap = $('#wfNodesWrap');
  if (!wrap) return;
  if (!wfState.nodes.length) {
    wrap.innerHTML = `<div class="wf-empty"><div class="wf-e-icon">🧩</div><h3>Belum ada step</h3><p>Klik "+ Contoh" untuk mulai, atau tambahkan step di bawah.</p></div>`;
    return;
  }
  wrap.innerHTML = wfState.nodes.map((n, i) => {
    const info = wfNodeType(n.type);
    const p = wfState.progress[n.id] || {};
    const cls = ['wf-node'];
    if (p.status === 'success') cls.push('success');
    if (p.status === 'running') cls.push('running');
    if (p.status === 'error') cls.push('error');
    const isInput = n.type === 'input';
    const isOutput = n.type === 'output';
    const preview = n.prompt ? n.prompt.replace(/\n/g, ' ').slice(0, 120) : (isInput ? 'Nilai dari panel Run di bawah' : isOutput ? 'Menampilkan hasil akhir' : '');
    return `
      <div class="${cls.join(' ')}" data-wf-id="${n.id}">
        <div class="wf-step-num">${i + 1}</div>
        <div class="wf-body">
          <div class="wf-title">
            <span>${info.icon} ${escapeHtml(n.name)}</span>
            <span class="wf-type-chip">${escapeHtml(info.label)}</span>
          </div>
          ${preview ? `<div class="wf-preview">${escapeHtml(preview)}</div>` : ''}
        </div>
        <div class="wf-actions">
          <button data-wf-up="${n.id}" title="Naik" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button data-wf-down="${n.id}" title="Turun" ${i === wfState.nodes.length - 1 ? 'disabled' : ''}>↓</button>
          <button data-wf-dup="${n.id}" title="Duplicate">⧉</button>
          <button data-wf-edit="${n.id}" title="Edit">✎</button>
          ${!isInput && !isOutput ? `<button class="wf-del" data-wf-del-node="${n.id}" title="Hapus">✕</button>` : `<button class="wf-del" data-wf-del-node="${n.id}" title="Hapus">✕</button>`}
        </div>
        <div class="wf-connector"></div>
      </div>`;
  }).join('');

  wrap.querySelectorAll('[data-wf-up]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); wfMoveNode(b.dataset.wfUp, -1); }));
  wrap.querySelectorAll('[data-wf-down]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); wfMoveNode(b.dataset.wfDown, 1); }));
  wrap.querySelectorAll('[data-wf-dup]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); wfDuplicateNode(b.dataset.wfDup); }));
  wrap.querySelectorAll('[data-wf-edit]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); wfOpenEditor(b.dataset.wfEdit); }));
  wrap.querySelectorAll('[data-wf-del-node]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); wfDeleteNode(b.dataset.wfDelNode); }));
}

/* =========================================================
   TOOL ROUTER (dispatch)
   ========================================================= */
function renderToolDetail(id){
  const tool = toolById(id);
  if (!tool) {
    $('#app').innerHTML = `<section class="view active"><div class="container"><div class="tool-detail"><a class="back-link" href="#/tools">← Kembali ke tools</a><div class="empty-state"><div class="empty-icon">🤖</div><h3>Tool tidak ditemukan</h3></div></div></div></section>`;
    return;
  }
  if (tool.type === 'chat') {
    if (!state.chats.length) { const nid = createNewChat(); location.hash = `#/chat/${nid}`; }
    else location.hash = '#/history';
    return;
  }
  if (tool.type === 'workflow') { location.hash = '#/workflow'; return; }
  if (tool.type === 'file') { renderFileAnalyzerView(); return; }
  if (tool.type === 'image') { renderImageAnalyzerView(); return; }
  renderFormView(tool);
}

/* =========================================================
   SETTINGS MODAL
   ========================================================= */
function openSettings(){
  const m = $('#settingsModal');
  $('#setModel').value = state.settings.model;
  $('#setVisionModel').value = state.settings.visionModel;
  $('#setTemp').value = state.settings.temperature;
  $('#tempLabel').textContent = Number(state.settings.temperature).toFixed(2);
  $('#setMaxTokens').value = state.settings.maxTokens;
  $('#setSysPrompt').value = state.settings.systemPrompt || '';
  m.classList.add('show'); m.setAttribute('aria-hidden','false');
  document.body.style.overflow = 'hidden';
}
function closeSettings(){
  const m = $('#settingsModal');
  m.classList.remove('show'); m.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
}

function wireSettings(){
  $('#settingsBtn').addEventListener('click', openSettings);
  const navBtn = $('#settingsBtnNav');
  if (navBtn) navBtn.addEventListener('click', openSettings);
  $('#closeSettings').addEventListener('click', closeSettings);
  $('#settingsModal').addEventListener('click', (e) => { if (e.target === $('#settingsModal')) closeSettings(); });

  $('#setTemp').addEventListener('input', (e) => { $('#tempLabel').textContent = Number(e.target.value).toFixed(2); });

  $('#saveSettings').addEventListener('click', () => {
    const model = $('#setModel').value.trim();
    const visionModel = $('#setVisionModel').value.trim();
    const temperature = parseFloat($('#setTemp').value);
    let maxTokens = parseInt($('#setMaxTokens').value, 10);
    if (!Number.isFinite(maxTokens) || maxTokens < 128) maxTokens = 128;
    if (maxTokens > 8192) maxTokens = 8192;
    const systemPrompt = $('#setSysPrompt').value;
    state.settings = { model: model || OPENAI_MODEL, visionModel: visionModel || OPENAI_VISION_MODEL_DEFAULT, temperature, maxTokens, systemPrompt };
    saveSettingsLS();
    closeSettings();
    toast('Settings disimpan', 'success', 1500);
    const lbl = $('#modelLabel'); if (lbl) lbl.textContent = modelLabel(state.settings.model);
  });

  $('#resetSettings').addEventListener('click', () => {
    state.settings = { ...DEFAULT_SETTINGS };
    saveSettingsLS(); openSettings();
    toast('Settings direset', 'info', 1400);
  });

  // Workflow editor modal
  $('#closeWfEditor').addEventListener('click', wfCloseEditor);
  $('#cancelWfEditor').addEventListener('click', wfCloseEditor);
  $('#wfEditorModal').addEventListener('click', (e) => { if (e.target === $('#wfEditorModal')) wfCloseEditor(); });
  $('#saveWfEditor').addEventListener('click', wfSaveEditor);
  $('#wfNodeTemp').addEventListener('input', (e) => { $('#wfNodeTempLabel').textContent = Number(e.target.value).toFixed(2); });

  // Import modal
  $('#closeWfImport').addEventListener('click', wfCloseImport);
  $('#cancelWfImport').addEventListener('click', wfCloseImport);
  $('#wfImportModal').addEventListener('click', (e) => { if (e.target === $('#wfImportModal')) wfCloseImport(); });
  $('#confirmWfImport').addEventListener('click', wfDoImport);
}

/* =========================================================
   ROUTER
   ========================================================= */
function parseRoute(){
  const raw = (location.hash || '#/home').slice(1);
  const [path, queryStr] = raw.split('?');
  const parts = path.split('/').filter(Boolean);
  const params = Object.fromEntries(new URLSearchParams(queryStr || ''));
  return { name: parts[0] || 'home', param: parts[1] || null, params };
}

function setActiveNav(name){
  $$('[data-nav]').forEach(a => a.classList.toggle('active', a.dataset.nav === name));
}

function router(){
  const { name, param, params } = parseRoute();
  closeDrawer();
  closeSettings();
  wfCloseEditor();
  window.scrollTo({ top: 0, behavior: 'auto' });

  switch (name) {
    case 'tools':      renderToolsView(params); setActiveNav('tools'); break;
    case 'favorites':  renderFavoritesView();   setActiveNav('favorites'); break;
    case 'history':    renderHistoryView();     setActiveNav('history'); break;
    case 'chat':       renderChatDetailView(param); setActiveNav('history'); break;
    case 'workflow':   renderWorkflowView();    setActiveNav('workflow'); break;
    case 'about':      renderAbout();           setActiveNav(''); break;
    case 'tool':       renderToolDetail(param); setActiveNav('tools'); break;
    case 'home':
    default:           renderHome();            setActiveNav('home');
  }
}

/* =========================================================
   GLOBAL EVENTS
   ========================================================= */
document.addEventListener('click', (e) => {
  const favBtn = e.target.closest('[data-fav]');
  if (favBtn) { e.preventDefault(); e.stopPropagation(); toggleFavorite(favBtn.dataset.fav); return; }

  const openEl = e.target.closest('[data-open]');
  if (openEl) { e.preventDefault(); location.hash = `#/tool/${openEl.dataset.open}`; return; }

  const chatOpen = e.target.closest('[data-chat-open]');
  if (chatOpen && !e.target.closest('[data-chat-rename]') && !e.target.closest('[data-chat-delete]')) {
    location.hash = `#/chat/${chatOpen.dataset.chatOpen}`; return;
  }
  const chatRen = e.target.closest('[data-chat-rename]');
  if (chatRen) { e.preventDefault(); e.stopPropagation(); renameChat(chatRen.dataset.chatRename); return; }
  const chatDel = e.target.closest('[data-chat-delete]');
  if (chatDel) { e.preventDefault(); e.stopPropagation(); deleteChat(chatDel.dataset.chatDelete); return; }

  const codeCopy = e.target.closest('[data-copy-code]');
  if (codeCopy) { const el = document.getElementById(codeCopy.dataset.copyCode); if (el) copyText(el.textContent, 'Kode disalin'); return; }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeDrawer(); closeSettings(); wfCloseEditor(); wfCloseImport(); }
  if (e.key === 'Enter' || e.key === ' ') {
    const card = e.target.closest?.('.tool-card');
    if (card && e.target === card) { e.preventDefault(); location.hash = `#/tool/${card.dataset.open}`; }
  }
});

$('#overlay').addEventListener('click', closeDrawer);
window.addEventListener('hashchange', router);
window.addEventListener('resize', () => { if (window.innerWidth >= 900) closeDrawer(); });

$('#themeToggle').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme(); saveTheme();
  toast(state.theme === 'dark' ? 'Dark mode on' : 'Light mode on', 'info', 1200);
});

$('#menuBtn').addEventListener('click', openDrawer);

/* =========================================================
   INIT
   ========================================================= */
function init(){
  applyTheme();
  renderDrawer();
  renderFooter();
  wireSettings();

  if (!location.hash) location.hash = '#/home';
  router();

  if (!isKeyConfigured()) setTimeout(() => toast('API key Groq belum diisi. Lihat halaman About.', 'error', 5000), 900);
}

init();
</script>
